<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad-m" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241738"/>
      <stop offset="70%" stop-color="#0b0716"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="ring-peach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b8"/>
      <stop offset="50%" stop-color="#ffb287"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glow-peach" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb287" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb287" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon-glow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="246" fill="url(#bg-grad-m)" stroke="#2d1f4d" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring-peach)" stroke-width="8" filter="url(#neon-glow-m)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#6a5fc1" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <circle cx="256" cy="210" r="140" fill="url(#glow-peach)" opacity="0.25"/>

  <!-- Digital Nomad Silhouette -->
  <!-- Tactical Jacket / Collar -->
  <path d="M 120 440 C 135 330, 180 310, 256 310 C 332 310, 377 330, 392 440 Z" fill="#2b1a3d" stroke="#6a5fc1" stroke-width="3"/>
  <path d="M 210 310 L 256 380 L 302 310" fill="none" stroke="#ffb287" stroke-width="3"/>

  <!-- Head & Confident Expression -->
  <rect x="238" y="260" width="36" height="60" rx="8" fill="#3b2554"/>
  <ellipse cx="256" cy="205" rx="62" ry="76" fill="#422961" stroke="#6a5fc1" stroke-width="3"/>

  <!-- Slick Modern Haircut & Beard Trim -->
  <path d="M 194 180 C 194 125, 230 115, 275 118 C 315 120, 322 145, 320 185 C 310 160, 280 150, 256 150 C 220 150, 204 165, 194 180 Z" fill="#ffb287" filter="url(#neon-glow-m)" opacity="0.95"/>
  <path d="M 220 230 Q 256 265 292 230" fill="none" stroke="#ffb287" stroke-width="3" opacity="0.8"/>

  <!-- Titanium Glasses (Nomad / Global Tech) -->
  <rect x="215" y="185" width="34" height="22" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="263" y="185" width="34" height="22" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="249" y1="195" x2="263" y2="195" stroke="#ffffff" stroke-width="3"/>

  <!-- Compass / Flight Icon Behind Head -->
  <path d="M 256 110 L 262 135 L 285 140 L 265 152 L 270 175 L 256 160 L 242 175 L 247 152 L 227 140 L 250 135 Z" fill="#ffd5b8" opacity="0.4"/>

  <!-- Badge Ribbon -->
  <rect x="156" y="420" width="200" height="44" rx="22" fill="#0b0716" stroke="#ffb287" stroke-width="3" filter="url(#neon-glow-m)"/>
  <text x="256" y="448" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffb287" text-anchor="middle" letter-spacing="3">RANK C · MILES</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">CONVERSATIONAL · NOMAD</text>
</svg>