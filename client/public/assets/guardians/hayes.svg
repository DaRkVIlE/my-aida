<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad-h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e183a"/>
      <stop offset="70%" stop-color="#0b0716"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="ring-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neon-glow-h" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="246" fill="url(#bg-grad-h)" stroke="#2d1f4d" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring-amber)" stroke-width="8" filter="url(#neon-glow-h)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Professor Silhouette -->
  <path d="M 120 440 C 135 340, 180 320, 256 320 C 332 320, 377 340, 392 440 Z" fill="#221739" stroke="#818cf8" stroke-width="3"/>
  <path d="M 200 325 L 256 385 L 312 325" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <rect x="236" y="270" width="40" height="60" rx="8" fill="#2f204d"/>
  <ellipse cx="256" cy="210" rx="65" ry="80" fill="#362557" stroke="#818cf8" stroke-width="3"/>

  <!-- Glasses -->
  <rect x="206" y="190" width="40" height="28" rx="6" fill="none" stroke="#fde68a" stroke-width="4" filter="url(#neon-glow-h)"/>
  <rect x="266" y="190" width="40" height="28" rx="6" fill="none" stroke="#fde68a" stroke-width="4" filter="url(#neon-glow-h)"/>
  <line x1="246" y1="204" x2="266" y2="204" stroke="#fde68a" stroke-width="4"/>

  <!-- Badge Ribbon -->
  <rect x="136" y="420" width="240" height="44" rx="22" fill="#0b0716" stroke="#f59e0b" stroke-width="3" filter="url(#neon-glow-h)"/>
  <text x="256" y="448" font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#f59e0b" text-anchor="middle" letter-spacing="3">PROF. HAYES</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">VOCABULARY &amp; FLUENCY MASTER</text>
</svg>