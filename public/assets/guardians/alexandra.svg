<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142642"/>
      <stop offset="70%" stop-color="#0b0716"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="ring-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon-glow-a" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="246" fill="url(#bg-grad-a)" stroke="#1e3a5f" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring-cyan)" stroke-width="8" filter="url(#neon-glow-a)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <circle cx="256" cy="210" r="140" fill="url(#glow-cyan)" opacity="0.25"/>

  <!-- High-Level Executive Blazer -->
  <path d="M 120 440 C 135 320, 180 300, 256 300 C 332 300, 377 320, 392 440 Z" fill="#14213d" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="256,300 230,370 256,410 282,370" fill="#0b0716" stroke="#38bdf8" stroke-width="2"/>
  <line x1="256" y1="410" x2="256" y2="440" stroke="#38bdf8" stroke-width="3"/>

  <!-- Elegant Head & Poised Posture -->
  <rect x="240" y="250" width="32" height="60" rx="8" fill="#203354"/>
  <ellipse cx="256" cy="195" rx="55" ry="70" fill="#29426d" stroke="#38bdf8" stroke-width="3"/>

  <!-- Architectural High-Bun / Professional Hairstyle -->
  <path d="M 200 190 C 200 120, 240 110, 275 115 C 310 120, 315 150, 310 190 C 295 160, 275 145, 256 145 C 230 145, 215 165, 200 190 Z" fill="#38bdf8" filter="url(#neon-glow-a)" opacity="0.95"/>
  <circle cx="256" cy="105" r="26" fill="#a5f3fc" filter="url(#neon-glow-a)"/>

  <!-- Commanding Gaze & Articulate Expression -->
  <line x1="225" y1="190" x2="245" y2="190" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="267" y1="190" x2="287" y2="190" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="235" cy="195" r="4" fill="#a5f3fc"/>
  <circle cx="277" cy="195" r="4" fill="#a5f3fc"/>
  <path d="M 240 225 Q 256 235 272 225" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Diamond Holographic Earring -->
  <polygon points="202,205 208,215 202,225 196,215" fill="#a5f3fc"/>

  <!-- Badge Ribbon -->
  <rect x="156" y="420" width="200" height="44" rx="22" fill="#0b0716" stroke="#38bdf8" stroke-width="3" filter="url(#neon-glow-a)"/>
  <text x="256" y="448" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="3">RANK A · ALEXANDRA</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">ARTICULATE SOVEREIGN</text>
</svg>