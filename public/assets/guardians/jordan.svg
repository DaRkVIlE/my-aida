<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1633"/>
      <stop offset="70%" stop-color="#0b0716"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="ring-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2fe7e"/>
      <stop offset="50%" stop-color="#c2ef4e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="glow-lime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2ef4e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2ef4e" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" stroke="#2d1f4d" stroke-width="4"/>

  <!-- Outer Neon Ring (Lime) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring-lime)" stroke-width="8" filter="url(#neon-glow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#6a5fc1" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="210" r="140" fill="url(#glow-lime)" opacity="0.25"/>

  <!-- Character Silhouette & Aesthetic Features -->
  <!-- Shoulders & Casual Jacket -->
  <path d="M 120 440 C 135 340, 180 320, 256 320 C 332 320, 377 340, 392 440 Z" fill="#241a3c" stroke="#6a5fc1" stroke-width="3"/>
  <path d="M 180 340 L 256 390 L 332 340" fill="none" stroke="#c2ef4e" stroke-width="3" opacity="0.8"/>

  <!-- Head / Neck -->
  <rect x="236" y="270" width="40" height="60" rx="8" fill="#362557"/>
  <ellipse cx="256" cy="210" rx="65" ry="80" fill="#3b2b5d" stroke="#6a5fc1" stroke-width="3"/>

  <!-- Modern Hair Style (Austin Indie / Texture) -->
  <path d="M 190 200 C 190 130, 230 120, 270 125 C 310 130, 325 150, 325 190 C 325 195, 310 165, 270 160 C 230 155, 205 180, 190 200 Z" fill="#c2ef4e" filter="url(#neon-glow)" opacity="0.9"/>

  <!-- Futuristic Audio Headphones (Austin Music Vibe) -->
  <path d="M 180 200 C 180 140, 332 140, 332 200" fill="none" stroke="#e2fe7e" stroke-width="8" stroke-linecap="round"/>
  <rect x="170" y="190" width="22" height="48" rx="10" fill="#c2ef4e"/>
  <rect x="320" y="190" width="22" height="48" rx="10" fill="#c2ef4e"/>

  <!-- Welcoming Facial Features (Minimalist Cyber-Zen) -->
  <path d="M 230 220 Q 256 240 282 220" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="230" cy="195" r="5" fill="#ffffff"/>
  <circle cx="282" cy="195" r="5" fill="#ffffff"/>

  <!-- Badge / Rank Ribbon -->
  <rect x="156" y="420" width="200" height="44" rx="22" fill="#0b0716" stroke="#c2ef4e" stroke-width="3" filter="url(#neon-glow)"/>
  <text x="256" y="448" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#c2ef4e" text-anchor="middle" letter-spacing="3">RANK D · JORDAN</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">STREET PATHFINDER · AUSTIN</text>
</svg>