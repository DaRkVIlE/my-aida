cache: true

# â”€â”€ Interface: Zero-config para o aluno â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
interface:
  modelSelect: true         # Exibe as 5 personas da AIDA no seletor nativo do topo
  presets: false            # Oculta presets técnicos
  parameters: false         # Oculta temperatura, max_tokens etc.
  agents:
    use: false              # Desativa aba técnica de Agents
    create: false
  customFooter: "[AIDA](https://aida.experiasolutions.com.br) — [📊 Meu Progresso](https://aida.experiasolutions.com.br/cockpit) · Imersão Ativa em Inglês com IA"
  helpAndFaqURL: "https://experiasolutions.com.br"
  privacyPolicy:
    externalUrl: "https://experiasolutions.com.br"
    openNewTab: true
  termsOfService:
    externalUrl: "https://experiasolutions.com.br"
    openNewTab: true

# â”€â”€ TTS & STT: Prática Oral Completa (Listening & Speaking) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# TTS: O aluno escuta a fala da AIDA (suporta Web Speech API nativo do navegador com Google US English, ou endpoint TTS)
# STT: Whisper integrado para o aluno falar no microfone em vez de só digitar.
speech:
  tts:
    openai:
      url: "http://localhost:8000/v1/audio/speech" # Endpoint proxy de áudio (Google TTS / Edge-TTS) ou Web Speech API local
      apiKey: "${TTS_API_KEY}"
      model: "tts-1"
      voices:
        - "en-US-AriaNeural"
        - "en-US-ChristopherNeural"
        - "en-US-GuyNeural"
        - "en-US-JennyNeural"
  stt:
    openai:
      url: "https://api.groq.com/openai/v1/audio/transcriptions" # Whisper no Groq (sub-300ms, tier free generoso) ou OpenAI
      apiKey: "${GROQ_API_KEY}"
      model: "whisper-large-v3-turbo"

# â”€â”€ Memória: Perfil persistente por aluno â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
memory:
  disabled: false
  validKeys:
    - "native_language"          # Idioma nativo do aluno
    - "english_level"            # beginner / elementary / intermediate / upper-intermediate / advanced
    - "learning_goal"            # travel / business / casual / academic / gaming
    - "preferred_persona"        # jordan / alexandra / miles / zack / hayes
    - "interests"                # hobbies, temas favoritos
    - "study_plan_week"          # semana atual do plano de estudos
    - "study_plan_focus"         # tópico/habilidade sendo trabalhado esta semana
    - "known_vocabulary"         # palavras/expressões já dominadas
    - "recurring_errors"         # padrões de erro para reforço indireto
    - "session_count"            # número de sessões realizadas
    - "last_topic"               # último tópico discutido
  tokenLimit: 8000
  maxInputTokens: 10000
  personalize: true

# â”€â”€ Model Specs: Personas como seletor de imersão â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
modelSpecs:
  enforce: true
  prioritize: true
  list:
