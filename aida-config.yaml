# TTS: O aluno escuta a fala da AIDA (suporta Web Speech API nativo do navegador com Google US English, ou endpoint TTS)
# STT: Whisper integrado para o aluno falar no microfone em vez de sÃ³ digitar.
speech:
  tts:
    openai:
      url: "http://localhost:8000/v1/audio/speech" # Endpoint proxy de Ã¡udio (Google TTS / Edge-TTS) ou Web Speech API local
      apiKey: "${TTS_API_KEY}"
      model: "tts-1"
